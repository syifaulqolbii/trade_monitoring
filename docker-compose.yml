# Deploy produksi Freebuff Monitor.
# Cara pakai (lihat DEPLOY.md):
#   1. Isi .env (AUTH_*, SESSION_SECRET, ENCRYPTION_KEY)
#   2. docker compose up -d --build
#
# Catatan: port 3000 hanya bind ke localhost — publik dihandle nginx
# yang sudah terpasang di VPS (reverse proxy + certbot).

services:
  web:
    build: .
    image: freebuff-monitor:latest
    restart: unless-stopped
    # Port host bisa diubah via APP_PORT di .env (mis. APP_PORT=3100)
    # bila 3000 sudah terpakai container lain di VPS.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # DB disimpan di volume terpisah, bukan di folder prisma,
      # supaya update image tidak menimpa/terhalangi data.
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - freebuff-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  freebuff-data: